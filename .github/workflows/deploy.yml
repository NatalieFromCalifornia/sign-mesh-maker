name: Deploy Firestore rules

# Frontend build + deploy is handled natively by Cloudflare's own
# Git-connected Workers Build (the "Connect to Git" flow in the Cloudflare
# dashboard) — it builds and runs `npx wrangler deploy` on every push
# automatically, reading wrangler.jsonc for the assets directory. No GitHub
# Action is needed for that anymore, so this workflow only handles the one
# piece Cloudflare doesn't: keeping Firestore rules/indexes in sync.

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx firebase-tools deploy --only firestore --token "${{ secrets.FIREBASE_TOKEN }}" --project "${{ secrets.FIREBASE_PROJECT_ID }}"
