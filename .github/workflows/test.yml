name: Tests

# Cloudflare builds and deploys the frontend on push regardless of this
# workflow, so treat a red run as a signal to revert rather than as a gate.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The Firestore emulator is a Java program. Declaring the JDK rather than
      # relying on whatever the runner image ships keeps this from breaking
      # when that image changes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # A fake project id keeps this off the real database.
      - run: npm run test:rules
        env:
          # Emulator downloads land here; caching them is not worth the
          # complexity for a job this short.
          FIREBASE_EMULATORS_PATH: ${{ runner.temp }}/firebase-emulators

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Chromium only — the suite covers rendering and layout behaviour, not
      # cross-browser differences.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
